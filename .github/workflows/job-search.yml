name: Job Search Test

on:
  workflow_dispatch:

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Test Arbeitnow API
        run: |
          python -c "import requests; r=requests.get('https://www.arbeitnow.co.uk/api/job-board-api', headers={'User-Agent':'Mozilla/5.0'}, timeout=30); print('STATUS:', r.status_code); print(r.text[:1000])"
